---
- name: Prepare apt for PPAs
  hosts: local
  gather_facts: false
  tasks:
    # provides add-apt-repository, used to add PPAs (apt-key is gone in modern ubuntu)
    - name: Install software-properties-common
      become: true
      become_user: root
      ansible.builtin.apt:
        name: software-properties-common
        state: present
        update_cache: true

- name: Install utilities
  import_playbook: ../install_packages/utilities.yml
- name: Clone dotfiles
  import_playbook: ../git_clone/git_clone.yml
- name: Symlink dotfiles
  import_playbook: ../symlink/dotfiles.yml
- name: Configure nvim
  import_playbook: ../configure/nvim.yml
- name: Clone personal repos
  import_playbook: ../git_clone/personal.yml
- name: Symlink personal repos
  import_playbook: ../symlink/personal.yml
- name: Symlink work scripts
  import_playbook: ../symlink/work.yml
