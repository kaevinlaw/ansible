---
- hosts: local
  gather_facts: no
  tasks:
    # provides add-apt-repository, used to add PPAs (apt-key is gone in modern ubuntu)
    - name: install software-properties-common
      become: true
      become_user: root
      apt:
        name: software-properties-common
        state: present
        update_cache: yes

- import_playbook: ../install_packages/utilities.yml
- import_playbook: ../git_clone/git_clone.yml
- import_playbook: ../symlink/dotfiles.yml
