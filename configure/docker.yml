---
- name: Configure docker
  hosts: local
  become: true
  become_user: root
  vars:
    # empty docker_storage_dir = keep docker's and containerd's default paths
    docker_custom_storage: "{{ docker_storage_dir | default('', true) | length > 0 }}"
    docker_data_root: "{{ docker_storage_dir ~ '/docker' if docker_custom_storage | bool else '/var/lib/docker' }}"
    containerd_root: "{{ docker_storage_dir ~ '/containerd' if docker_custom_storage | bool else '/var/lib/containerd' }}"
  tasks:

    # docker-ce creates this group itself; kept so this playbook also works
    # before docker is installed
    - name: Create docker user group
      ansible.builtin.group:
        name: docker
        state: present

    # takes effect at the user's next login
    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: docker
        append: true

    # service_mgr reports "systemd" whenever it's installed (e.g. containers);
    # /run/systemd/system only exists when systemd is actually running
    - name: Check whether systemd is running
      ansible.builtin.stat:
        path: /run/systemd/system
      register: systemd_running

    # Use the containerd image store (snapshotters) instead of the classic
    # overlay2 graph driver. Default on fresh Docker Engine 29+ installs; this
    # makes it explicit and switches hosts upgraded from older versions.
    # Merged into any existing daemon.json so other settings are kept.
    - name: Read existing docker daemon.json
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_daemon_json
      failed_when: false

    - name: Configure daemon.json (containerd image store, data-root)
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: "{{ (docker_daemon_current | combine({'data-root': docker_data_root})
                      if docker_custom_storage | bool
                      else docker_daemon_current | dict2items | rejectattr('key', 'equalto', 'data-root') | items2dict)
                     | combine({'features': {'containerd-snapshotter': true}}, recursive=true)
                     | to_nice_json }}\n"
        validate: dockerd --validate --config-file %s
      vars:
        docker_daemon_current: "{{ (docker_daemon_json.content | b64decode | from_json) if docker_daemon_json.content is defined else {} }}"
      notify: Restart docker

    # images/snapshots (containerd image store) follow containerd's root
    - name: Create docker storage directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0711"
      loop:
        - "{{ docker_storage_dir }}"
        - "{{ docker_storage_dir }}/containerd"
        - "{{ docker_storage_dir }}/docker"
      when: docker_custom_storage | bool

    # top-level key, so it goes before any [table]; replaces the commented
    # default (#root = "/var/lib/containerd") that containerd.io ships
    - name: Set containerd root
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^#?\s*root\s*='
        line: 'root = "{{ containerd_root }}"'
        insertbefore: BOF
        firstmatch: true
      when: docker_custom_storage | bool
      notify: Restart containerd

    # only an active (uncommented) root line; containerd then uses its default
    - name: Reset containerd root to default
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^\s*root\s*='
        state: absent
      when: not docker_custom_storage | bool
      notify: Restart containerd

    - name: Enable and start docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started
      when: systemd_running.stat.exists

    - name: Apply daemon.json now
      ansible.builtin.meta: flush_handlers

    - name: Check docker uses the containerd image store
      ansible.builtin.command: docker info --format "{{ '{{' }}json .DriverStatus{{ '}}' }}"
      register: docker_driver_status
      changed_when: false
      failed_when: "'io.containerd.snapshotter' not in docker_driver_status.stdout"
      when: systemd_running.stat.exists

    - name: Check docker and containerd storage paths
      ansible.builtin.shell: |
        docker info --format '{{ '{{' }}.DockerRootDir{{ '}}' }}'
        containerd config dump | sed -n "s/^root = '\(.*\)'/\1/p"
      register: docker_storage_check
      changed_when: false
      failed_when: >-
        docker_storage_check.stdout_lines !=
        [docker_data_root, containerd_root]
      when: systemd_running.stat.exists

  handlers:
    # listed before "restart docker" so containerd is back up first
    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
      when: systemd_running.stat.exists

    # Restarting the daemon stops running containers (unless live-restore is
    # set). After switching stores, images/containers from overlay2 are hidden
    # (still in /var/lib/docker) until pulled/created again. Same when
    # docker_storage_dir changes: old data stays at the old path.
    - name: Restart docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
      when: systemd_running.stat.exists
