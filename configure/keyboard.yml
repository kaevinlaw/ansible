---
- hosts: local
  become: true
  become_user: root
  tasks:
    - name: Remap capslock to ctrl
      ansible.builtin.lineinfile:
        dest: /etc/default/keyboard
        regexp: '^XKBOPTIONS='        # replace whatever value is there, not only ""
        line: 'XKBOPTIONS="ctrl:nocaps"'
      notify: Apply keyboard config

  handlers:
    # /etc/default/keyboard is otherwise only read at boot. This re-applies it
    # to the console and to new X sessions; the running session still needs a
    # logout (or `setxkbmap -option ctrl:nocaps`).
    - name: Apply keyboard config
      ansible.builtin.shell: |
        udevadm trigger --subsystem-match=input --action=change
        setupcon --force || true
