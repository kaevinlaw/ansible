---
- hosts: local
  become: false
  tasks:
    - name: Ensure Node.js and npm are installed
      become: true
      ansible.builtin.apt:
        name:
          - nodejs
          - npm
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install tree-sitter CLI globally via npm
      become: true
      community.general.npm:
        name: tree-sitter-cli
        global: true
        state: present

    - name: Install/update nvim plugins with lazy
      ansible.builtin.command: nvim --headless "+Lazy! sync" +qa
      changed_when: false

    # language servers listed in dotfiles nvim/lua/config/lsp.lua (mason_servers)
    - name: Install LSP servers with mason
      ansible.builtin.command: nvim --headless "+MasonToolsInstallSync" +qa
      changed_when: false
