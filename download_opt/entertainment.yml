---
- name: Download entertainment tools
  hosts: local
  tasks:
    - name: Ensure opt dirs exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ user_opt_dir }}/yt-dlp"
        - "{{ user_opt_dir }}/yt-x"

    # ---- yt-dlp ----
    # get_url downloads to a temp file and only replaces yt-dlp (atomically)
    # when the checksum differs, so this is changed only on a new release
    - name: Download latest yt-dlp
      ansible.builtin.get_url:
        url: https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
        dest: "{{ user_opt_dir }}/yt-dlp/yt-dlp"
        mode: "0755"
        force: true

    # ---- yt-x ----
    # get_url downloads to a temp file and only replaces yt-x (atomically)
    # when the checksum differs, so this is changed only on a new release
    - name: Download latest yt-x
      ansible.builtin.get_url:
        url: https://github.com/Benexl/yt-x/releases/latest/download/yt-x
        dest: "{{ user_opt_dir }}/yt-x/yt-x"
        mode: "0755"
        force: true
