---
# Docker Engine from Docker's apt repo, following
# https://docs.docker.com/engine/install/ubuntu/
- hosts: local
  become: true
  become_user: root
  tasks:
    # Ubuntu's own docker packages conflict with Docker's (containerd.io ships
    # its own containerd + runc)
    - name: remove conflicting distro packages
      ansible.builtin.apt:
        state: absent
        name:
          - docker.io
          - docker-doc
          - docker-compose
          - docker-compose-v2
          - podman-docker
          - containerd
          - runc

    - name: install required packages
      ansible.builtin.apt:
        state: present
        name:
          - ca-certificates
          - curl
        update_cache: true

    # apt-key is gone; keys now live in /etc/apt/keyrings and are referenced
    # per-source with Signed-By
    - name: add docker's official gpg key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    # left behind by the old apt_repository task; a second docker source with
    # a different Signed-By makes apt refuse to update
    - name: remove old-style docker source
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
        state: absent

    - name: add docker's stable repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: install docker packages
      ansible.builtin.apt:
        state: present
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin   # `docker compose` (v2); replaces docker-compose v1
        update_cache: true
