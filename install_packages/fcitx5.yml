---
# fcitx5 itself for Ubuntu 26.04 GNOME (Wayland): frontends, configtool,
# im-config, tray icon, fonts. No input method; add one or both with
# fcitx5_quick.yml (Quick Classic) and fcitx5_rime.yml (Rime).
# Packages only. Config: configure/fcitx5_quick.yml, configure/fcitx5_rime.yml
- name: Install fcitx5
  hosts: local
  tasks:
    - name: Install fcitx5
      become: true
      become_user: root
      ansible.builtin.apt:
        state: present
        name:
          - im-config                          # im-config -n fcitx5 (writes ~/.xinputrc)
          - fcitx5
          - fcitx5-frontend-all                # gtk3/gtk4/qt5/qt6 frontends
          - fcitx5-config-qt                   # fcitx5-configtool
          - gnome-shell-extension-appindicator # tray icon in GNOME top bar

            # fonts
          - fonts-noto-cjk                     # Noto Sans CJK TC: candidate list, sans-serif CJK fallback
          - fonts-dejavu-core                  # DejaVu Sans: symbols Ubuntu Sans lacks (clock ∶ U+2236)
          # - fonts-hanazono                   # CJK Ext A/B glyphs, rare chars instead of tofu

            # not needed:
            # fcitx5-chinese-addons    only for pinyin / trad-simp conversion
            # fonts-noto-cjk-extra, fonts-wqy-*
        update_cache: true
        install_recommends: false
