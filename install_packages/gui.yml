---
- hosts: local
  tasks:
    - name: install packages
      become: true
      become_user: root
      ansible.builtin.apt:
        state: fixed
        name:
          - kitty
          - imagemagick
          - xorg
          - xinit
          - xauth
          - i3
          - dmenu
          - i3status
          - feh
          - picom
          - conky
          - qutebrowser
          #- lightdm
          #- xubuntu-core
        update_cache: true
        install_recommends: false
