---
- hosts: local
  tasks:
    - name: Install packages
      become: true
      become_user: root
      ansible.builtin.apt:
        state: fixed
        name:
          - libasound2
          - libasound2-plugins
          - alsa-utils
          - alsa-oss
          - pulseaudio
          - pulseaudio-utils
        update_cache: true
        install_recommends: false
