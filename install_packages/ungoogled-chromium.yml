---
# ungoogled-chromium (chromium without Google services/telemetry) as a .deb
# from the xtradeb PPA. Ubuntu doesn't package it. It installs alongside
# install_packages/chromium.yml (same PPA) without conflicts.
- hosts: local
  become: true
  become_user: root
  tasks:
    - name: add xtradeb apps PPA
      command: add-apt-repository -y ppa:xtradeb/apps
      args:
        creates: /etc/apt/sources.list.d/xtradeb-ubuntu-apps-{{ ansible_facts['distribution_release'] }}.sources

    # The PPA carries many other apps; keep them from replacing Ubuntu's
    # packages and only take ungoogled-chromium (and its -common, -sandbox, ...).
    # Package-specific pins win over "Package: *", so this coexists with the
    # pin file from chromium.yml.
    - name: pin ungoogled-chromium to the xtradeb PPA
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/ungoogled-chromium-ppa
        mode: "0644"
        content: |
          Package: ungoogled-chromium*
          Pin: release o=LP-PPA-xtradeb-apps
          Pin-Priority: 1001

          Package: *
          Pin: release o=LP-PPA-xtradeb-apps
          Pin-Priority: 100

    - name: install ungoogled-chromium
      apt:
        name: ungoogled-chromium
        state: present
        update_cache: yes
