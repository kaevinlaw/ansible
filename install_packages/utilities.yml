---
- hosts: local
  tasks:
    - name: Add neovim-ppa unstable
      become: true
      become_user: root
      ansible.builtin.command: add-apt-repository -y ppa:neovim-ppa/unstable
      args:
        creates: /etc/apt/sources.list.d/neovim-ppa-ubuntu-unstable-{{ ansible_facts['distribution_release'] }}.sources
    - name: Install packages
      become: true
      become_user: root
      ansible.builtin.apt:
        state: present
        name:
            # nvim
          - neovim
          - ripgrep
          - fzf
          - bat

            # nodejs
          - nodejs
          - npm

            # python
          - python3
          - python3-pip
          - python3-venv
          - python3-dev
            # python3-distutils: removed in python 3.12 (ubuntu 24.04+)

            # dev related
          - clangd
          - build-essential
          - git
          - icdiff
          - tig
          - tree
          - repo
          - gdb
          - minicom
          - lnav
          - autoconf
          - automake
          - bison
          - libtool
          - libtool-bin
          - flex
          - texinfo
          - help2man
          - libncurses-dev
            # - libncurses5

            # android
          - adb
          - fastboot
          - policycoreutils-python-utils

            # misc admin
          - tmux
          - curl
          - rsync
          - ncdu
          - zip
          - unzip
          - 7zip
          - lftp
          - tcpdump
          - bind9-dnsutils

          - pandoc
          - poppler-utils

          # ffmpeg
          - f2fs-tools

          - exfatprogs

          # key
          - gcr4
          - gnome-keyring
          - libpam-gnome-keyring

        update_cache: true
        install_recommends: false
