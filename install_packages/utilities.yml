---
- hosts: local
  tasks:
    - name: add neovim-ppa unstable
      become: true
      become_user: root
      command: add-apt-repository -y ppa:neovim-ppa/unstable
      args:
        creates: /etc/apt/sources.list.d/neovim-ppa-ubuntu-unstable-{{ ansible_facts['distribution_release'] }}.sources
    - name: install packages
      become: true
      become_user: root
      apt:
        state: present
        name:
            #nvim
          - neovim
          - ripgrep
          - fzf
          - bat

            #nodejs
          - nodejs
          - npm

            #python
          - python3
          - python3-pip
          - python3-dev
            # python3-distutils: removed in python 3.12 (ubuntu 24.04+)

            #dev related
          - clangd
          - build-essential
          - git
          - tig
          - tree
          - repo
          - gdb
          - minicom
          - lnav
          - autoconf
          - automake
          - bison
          - libtool
          - libtool-bin
          - flex
          - texinfo
          - help2man
          - libncurses-dev
            #- libncurses5

            #android
          - adb
          - fastboot
          - policycoreutils-python-utils

            #misc admin
          - tmux
          - curl
          - rsync
            #- samba
          - ncdu
          - zip
          - unzip
          - 7zip
          - lftp
          - tcpdump
          - bind9-dnsutils
          #- vifm

            #ripgrep-all
          - pandoc
          - poppler-utils

          # ffmpeg
          - f2fs-tools

        update_cache: yes
        install_recommends: no
