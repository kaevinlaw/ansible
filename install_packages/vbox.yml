---
- name: Install vbox guest additions dependencies
  hosts: local
  tasks:
    - name: Install packages for vbox guest additions
      become: true
      become_user: root
      ansible.builtin.apt:
        state: present
        name:
            # misc admin
          - dkms
          - build-essential
          - "linux-headers-{{ ansible_kernel }}"
          - virtualbox-guest-additions-iso
        update_cache: true
        install_recommends: false
