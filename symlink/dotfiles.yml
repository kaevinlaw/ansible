---
- name: Symlink dotfiles
  hosts: local
  become: true
  become_user: "{{ target_user }}"
  tasks:

    - name: Creates nvim and autoload folder
      ansible.builtin.file:
        path: "{{ target_home }}/.config/nvim/autoload"
        state: directory

    - name: Symlink nvim init.lua
      ansible.builtin.file:
        src: "{{ repos_dir }}/dotfiles/nvim/init.lua"
        dest: "{{ target_home }}/.config/nvim/init.lua"
        state: link
        force: true

    - name: Symlink init.lua
      ansible.builtin.file:
        src: "{{ repos_dir }}/dotfiles/nvim/lua"
        dest: "{{ target_home }}/.config/nvim/lua"
        state: link
        force: true

    - name: Symlink nvim plugin
      ansible.builtin.file:
        src: "{{ repos_dir }}/dotfiles/nvim/plugin/"
        dest: "{{ target_home }}/.config/nvim/plugin_config"
        state: link


    - name: Symlink tmux
      ansible.builtin.file:
        src: "{{ repos_dir }}/dotfiles/tmux/"
        dest: "{{ target_home }}/.config/tmux"
        state: link

    - name: Symlink tmux conf
      ansible.builtin.file:
        src: "{{ target_home }}/.config/tmux/tmux.conf"
        dest: "{{ target_home }}/.tmux.conf"
        state: link

    - name: Symlink tig
      ansible.builtin.file:
        src: "{{ repos_dir }}/dotfiles/tig/"
        dest: "{{ target_home }}/.config/tig"
        state: link

    - name: Symlink tigrc
      ansible.builtin.file:
        src: "{{ target_home }}/.config/tig/tigrc"
        dest: "{{ target_home }}/.tigrc"
        state: link

    - name: Symlink gitconfig
      ansible.builtin.file:
        src: "{{ repos_dir }}/dotfiles/git/gitconfig"
        dest: "{{ target_home }}/.gitconfig"
        state: link

    - name: Creates i3 config
      ansible.builtin.file:
        path: "{{ target_home }}/.config/i3"
        state: directory

    - name: Symlink i3config
      ansible.builtin.file:
        src: "{{ repos_dir }}/dotfiles/i3/i3config"
        dest: "{{ target_home }}/.config/i3/config"
        state: link

    - name: Creates kitty config
      ansible.builtin.file:
        path: "{{ target_home }}/.config/kitty"
        state: directory

    - name: Symlink kitty
      ansible.builtin.file:
        src: "{{ repos_dir }}/dotfiles/kitty/kitty.conf"
        dest: "{{ target_home }}/.config/kitty/kitty.conf"
        state: link

    - name: Creates picom config
      ansible.builtin.file:
        path: "{{ target_home }}/.config/picom"
        state: directory

    - name: Symlink picom
      ansible.builtin.file:
        src: "{{ repos_dir }}/dotfiles/picom/picom.conf"
        dest: "{{ target_home }}/.config/picom/picom.conf"
        state: link

    - name: Creates ytfzf config
      ansible.builtin.file:
        path: "{{ target_home }}/.config/ytfzf"
        state: directory

    - name: Symlink ytfzf
      ansible.builtin.file:
        src: "{{ repos_dir }}/dotfiles/ytfzf/conf.sh"
        dest: "{{ target_home }}/.config/ytfzf/conf.sh"
        state: link

