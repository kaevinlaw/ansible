      ansible.builtin.file:
        src: /repos/dotfiles/picom/picom.conf
        dest: "{{ target_home }}/.config/picom/picom.conf"
        state: link
        owner: "{{ target_user }}"
        group: "{{ target_group }}"

    - name: Creates ytfzf config
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ target_home }}/.config/ytfzf"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_group }}"

    - name: Symlink ytfzf
      become: true
      become_user: root
      ansible.builtin.file:
        src: /repos/dotfiles/ytfzf/conf.sh
