---
- name: Symlink personal repos
  hosts: local
  become: true
  become_user: "{{ target_user }}"
  tasks:

    - name: Symlink vimviki
      ansible.builtin.file:
        src: "{{ repos_dir }}/vimviki"
        dest: "{{ target_home }}/vimviki"
        state: link

    - name: Symlink plutus
      ansible.builtin.file:
        src: "{{ repos_dir }}/fin"
        dest: "{{ target_home }}/plutus"
        state: link
